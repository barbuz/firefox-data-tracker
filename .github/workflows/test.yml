name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Lint extension
        run: npm run lint
      - name: Build extension
        run: npm run build
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: data-tracker
          path: web-ext-artifacts/*.zip
